name: contagem
description: "Contagem — Competição social de bebidas entre amigos."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado & Navegação
  flutter_riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Tema & UI
  flex_color_scheme: ^8.0.2
  google_fonts: ^6.2.1
  gap: ^3.0.1
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  confetti: ^0.8.0
  glass: ^2.0.0+1

  # Backend
  supabase_flutter: ^2.8.3

  # Utilidades
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  intl: ^0.20.1
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  fl_chart: ^0.69.2
  collection: ^1.18.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - web/icons/
