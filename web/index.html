<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Contagem — Competição social de bebidas entre amigos. Crie grupos, registre suas bebidas, suba no ranking e divirta-se.">

  <!-- PWA / iOS meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Contagem">
  <meta name="theme-color" content="#1FB45C">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>Contagem — Copa das Bebidas</title>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0B0E14; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(circle at 50% 35%, #0F2418 0%, #0B0E14 70%);
      color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .4s ease; z-index: 9999;
    }
    #splash .logo {
      width: clamp(84px, 26vw, 120px);
      height: clamp(84px, 26vw, 120px);
      border-radius: clamp(22px, 7vw, 30px);
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(31,180,92,.45);
      animation: pulse 2s ease-in-out infinite;
    }
    #splash .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    #splash .title { font-size: clamp(22px, 7vw, 28px); font-weight: 700; letter-spacing: -.5px; }
    #splash .subtitle { font-size: clamp(12px, 3.6vw, 14px); opacity: .6; font-weight: 500; }
    @keyframes pulse {
      0%,100% { transform: scale(1); } 50% { transform: scale(1.06); }
    }
    #splash.gone { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo"><img src="icons/Icon-192.png" alt="Contagem"></div>
    <div class="title">Contagem</div>
    <div class="subtitle">Copa das Bebidas</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.classList.add('gone'); setTimeout(function(){ s.remove(); }, 500); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
