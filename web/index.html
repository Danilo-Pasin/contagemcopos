<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OGS — registre suas bebidas e suba no ranking da festa.">

  <!-- PWA / iOS meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OGS">
  <meta name="theme-color" content="#1FB45C">
  <!-- Ícone da home screen do iOS (180x180). URL nova força o iOS a re-buscar
       (o iOS cacheia o ícone por URL e não atualiza na mesma rota). -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <!-- .ico na raiz: o Safari (macOS) busca /favicon.ico em vez do <link> PNG. -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <!-- PNG versionado (?v=2): obriga os demais navegadores a ignorar o cache. -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>
  <link rel="manifest" href="manifest.json">

  <title>OGS</title>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0B0E14; }
    /* Bloqueia o double-tap tool do Safari (smart-zoom). No PWA iOS isso
       dessincroniza o hit-test do canvas do Flutter ("botões não respondem
       / registram o toque no botão de baixo") após focar um TextField.
       O iOS ignora user-scalable=no, então a trava robusta é touch-action. */
    html, body { touch-action: manipulation; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(circle at 50% 35%, #0F2418 0%, #0B0E14 70%);
      color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .4s ease; z-index: 9999;
    }
    #splash .logo {
      width: clamp(84px, 26vw, 120px);
      height: clamp(84px, 26vw, 120px);
      border-radius: clamp(22px, 7vw, 30px);
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(31,180,92,.45);
      animation: pulse 2s ease-in-out infinite;
    }
    #splash .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    #splash .title { font-size: clamp(22px, 7vw, 28px); font-weight: 700; letter-spacing: -.5px; }
    #splash .subtitle { font-size: clamp(12px, 3.6vw, 14px); opacity: .6; font-weight: 500; }
    @keyframes pulse {
      0%,100% { transform: scale(1); } 50% { transform: scale(1.06); }
    }
    #splash.gone { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo"><img src="icons/Icon-192.png" alt="OGS"></div>
    <div class="title">OGS</div>
    <div class="subtitle">Copa da Ressaca</div>
  </div>

  <script>
    // iOS PWA standalone: trabalha em torno do "teclado fantasma" que deixa a
    // parte de baixo da tela sem resposta (flutter/flutter#111896/#115829).
    // Listeners passivos + reset de scroll recolhem o offset de viewport que o
    // iOS ergue após focar um TextField, restaurando o toque na NavigationBar.
    (function () {
      var isIosStandalone =
        window.navigator.standalone === true ||
        (window.navigator.userAgent.indexOf('iPhone') !== -1 ||
          window.navigator.userAgent.indexOf('iPad') !== -1);
      if (!isIosStandalone) return;
      document.addEventListener('touchstart', function () {}, {
        passive: true,
      });
      function resetScroll() {
        if (window.scrollY > 0) window.scrollTo(0, 0);
        if (window.visualViewport) {
          var v = window.visualViewport;
          if (v.offsetTop > 0 || v.offsetLeft > 0) v.scrollTo(0, 0);
        }
      }
      ['focusout', 'resize', 'pageshow', 'visibilitychange'].forEach(function (ev) {
        window.addEventListener(ev, resetScroll, { passive: true });
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', resetScroll, {
          passive: true,
        });
      }
    })();

    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      window.scrollTo(0, 0);
      if (s) { s.classList.add('gone'); setTimeout(function(){ s.remove(); }, 500); }
    });

    // Timeout de segurança: se o primeiro frame nunca disparar (ex.: init do
    // wasm lento no iOS), remove o overlay de z-9999 que bloquearia todos os
    // toques para sempre.
    setTimeout(function () {
      var s = document.getElementById('splash');
      if (s) { s.classList.add('gone'); setTimeout(function(){ s.remove(); }, 300); }
    }, 12000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
